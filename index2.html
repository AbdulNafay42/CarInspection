<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>503 - Server Unavailable</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      font-family: Arial, sans-serif;
      color: #111827;
      background:
        linear-gradient(rgba(17, 24, 39, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 24, 39, 0.04) 1px, transparent 1px),
        #f9fafb;
      background-size: 40px 40px;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 70px;
    }

    /* Server Illustration */
    .illustration {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .server {
      width: 260px;
    }

    .server-box {
      height: 72px;
      margin-bottom: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    .server-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 5px #fee2e2;
    }

    .server-lines {
      flex: 1;
    }

    .line {
      height: 7px;
      margin-bottom: 7px;
      border-radius: 5px;
      background: #e5e7eb;
    }

    .line.short {
      width: 60%;
    }

    .server-base {
      height: 14px;
      border-radius: 50%;
      background: #d1d5db;
      filter: blur(1px);
    }

    .error-badge {
      position: absolute;
      top: -25px;
      right: 20px;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 25px;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
    }

    /* Content */
    .content {
      max-width: 430px;
    }

    .error-code {
      margin-bottom: 15px;
      color: #ef4444;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 48px;
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .description {
      margin-bottom: 25px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 10px 15px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff1f2;
      color: #b91c1c;
      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .retry {
      border: none;
      padding: 13px 22px;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .retry:hover {
      background: #374151;
      transform: translateY(-1px);
    }

    .home {
      color: #6b7280;
      font-size: 14px;
      text-decoration: none;
    }

    .home:hover {
      color: #111827;
    }

    .incident {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 12px;
    }

    /* Mobile */
    @media (max-width: 700px) {
      body {
        padding: 25px 20px;
      }

      .wrapper {
        grid-template-columns: 1fr;
        gap: 45px;
        text-align: center;
      }

      .content {
        max-width: 100%;
      }

      .status {
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        justify-content: center;
      }

      h1 {
        font-size: 38px;
      }

      .error-badge {
        right: calc(50% - 145px);
      }
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 32px;
      }

      .server {
        width: 220px;
      }

      .actions {
        flex-direction: column;
      }

      .retry {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="wrapper">

    <!-- Illustration -->
    <div class="illustration">

      <div class="error-badge">
        !
      </div>

      <div class="server">

        <div class="server-box">
          <div class="server-light"></div>

          <div class="server-lines">
            <div class="line"></div>
            <div class="line short"></div>
          </div>
        </div>

        <div class="server-box">
          <div class="server-light"></div>

          <div class="server-lines">
            <div class="line"></div>
            <div class="line short"></div>
          </div>
        </div>

        <div class="server-box">
          <div class="server-light"></div>

          <div class="server-lines">
            <div class="line"></div>
            <div class="line short"></div>
          </div>
        </div>

        <div class="server-base"></div>

      </div>
    </div>


    <!-- Content -->
    <section class="content">


      <h1>
        Server temporarily unavailable.
      </h1>

      <p class="description">
        We're experiencing a temporary issue with our servers.
        Our team is already working on it. Please try again
        after a few moments.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Service temporarily offline
      </div>

      <div class="actions">

        <button class="retry" onclick="location.reload()">
          ↻ &nbsp; Try Again
        </button>

      </div>


    </section>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>503 Service Unavailable</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #fff;
      color: #202124;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .error-page {
      width: 100%;
      max-width: 620px;
    }

    .error-code {
      font-size: 72px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -4px;
      color: #202124;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 500;
      color: #202124;
    }

    p {
      margin: 0;
      max-width: 560px;

      font-size: 16px;
      line-height: 1.6;
      color: #5f6368;
    }

    .details {
      margin-top: 32px;
      padding-top: 20px;

      border-top: 1px solid #dadce0;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.8;
      color: #80868b;
    }

    .footer {
      margin-top: 40px;

      font-size: 13px;
      color: #9aa0a6;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 58px;
        letter-spacing: -3px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="error-code">503</div>

    <h1>Service Unavailable</h1>

    <p>
      The server is temporarily unable to handle this request.
      Please try again later.
    </p>

    <div class="details">
      Error: SERVICE_UNAVAILABLE<br>
      Status: 503<br>
      Request ID: PF-7A3C91D2
    </div>

    <div class="footer">
      ProvinFinder
    </div>

  </main>

</body>
</html>
